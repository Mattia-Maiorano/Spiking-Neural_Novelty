# SPWM v6.2 – Continuous Attractor Neural Network (CANN) Integration
# Built on the solid v6 baseline (256 ALIF neurons, [128, 128] dual-timescale, q_dim=32, p_dim=96)
# Replaces unconstrained dead reckoning integration with a Continuous Attractor Neural Network (CANN)
# to anchor coordinate dynamics to a compact topological manifold and eliminate long-horizon drift (H=100).

project:
  name: "spwm_v6_2"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # total = q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9          # EMA decay for spike buffer
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0
  # CANN Configuration (v6.2)
  use_cann: true
  cann_num_basis: 64
  cann_sigma: 0.5
  cann_temperature: 0.1

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [128, 128]  # Population Scaling: 256 ALIF spiking neurons (128 reactive, 128 context)
  betas: [0.90, 0.985]

training:
  epochs: 40
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  weight_decay: 0.0001
  batch_size: 32
  grad_clip_norm: 1.0

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 2.0
  lambda_coord: 0.15

evaluation:
  save_best_metric: "val_pos_err"
  rollout_horizons: [1, 5, 10, 25, 50, 100]
