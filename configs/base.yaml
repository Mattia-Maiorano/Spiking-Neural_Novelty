# SPWM-v3.1 Base Configuration
project:
  name: "spwm_v3_1"
  description: "Spiking Predictive World Model with ALIF Core, Trace Normalization and Forward-Only e-prop"
  seed: 42

environment:
  box_size: 1.0
  default_radius: 0.12
  dt: 0.05
  noise_std: 0.01
  damping: 0.0
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 1000
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32
  standard_velocity_range: [-1.0, 1.0]
  extrapolation_velocity_range: [-2.0, 2.0]
  num_workers: 0
  cache_data: true

model:
  type: "spwm"
  in_channels: 2
  encoder_conv_channels: [32, 64]
  encoder_dim: 128
  latent_dim: 128
  predictor_hidden_dim: 256
  local_lr: 0.0005

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [64, 64]
  betas: [0.90, 0.985]

training:
  learning_algorithm: "online_eprop"
  learning_rate: 0.0005
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  epochs: 25
  batch_size: 32

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 0.5
  multi_step_horizon: 3
  target_variance: 1.0

evaluation:
  rollout_horizons: [1, 5, 10, 25, 50]
