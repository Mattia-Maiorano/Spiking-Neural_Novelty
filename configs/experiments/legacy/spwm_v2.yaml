# Primary SPWM-v2 (Non-BPTT Continuous Predictive World Model) Experiment Configuration
project:
  name: "spwm_v2_primary"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 30
  batch_size: 32

model:
  type: "spwm"
  encoder_dim: 128
  latent_dim: 128
  predictor_hidden_dim: 256
  local_lr: 0.0005
  inhibition_strength: 0.3
  alignment_noise_std: 0.01
  spatial_decay_sigma: 0.15

memory:
  num_timescales: 3
  timescale_dims: [32, 64, 32]
  betas: [0.50, 0.90, 0.999]

training:
  epochs: 20
  learning_rate: 0.0005
  batch_size: 32
  sleep_interval: 1
  sleep_top_k: 16

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 0.5

evaluation:
  rollout_horizons: [1, 5, 10, 25]
