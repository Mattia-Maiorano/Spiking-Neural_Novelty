# Tiny Gate Diagnostic Configuration for Overfitting Test (8 Trajectories, T=150)
project:
  name: "spwm_v3_tiny_gate"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 8
  train_split: 1.0
  val_split: 0.0
  sequence_length: 150
  batch_size: 4

model:
  type: "spwm"
  encoder_dim: 128
  latent_dim: 128
  predictor_hidden_dim: 256
  local_lr: 0.0005

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [64, 64]
  betas: [0.90, 0.985]

training:
  epochs: 10
  learning_rate: 0.0005
  batch_size: 4

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 0.5

evaluation:
  rollout_horizons: [1, 5, 10, 25, 50]
