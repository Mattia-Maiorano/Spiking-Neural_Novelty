# SPWM-v8.4: Chained Window Rollout & Stationary Contraction Mapping
#
# Reformulates Slow Corrector training as a recursive contraction mapping:
# 1. Stationary Local Kinematic Input:
#    - Input is strictly x_corr(t) = Concat(s_t^{fast}, s_{t-1})
#    - Time-invariant policy without non-stationary sinusoidal phase embeddings
# 2. Chained Window Rollout (H = 25):
#    - Window A (t = 1..H) starts from nominal ground truth s_0^*
#    - Detached state transfer: s_hat_init_B = s_hat_H.detach()
#    - Window B (t = H+1..2H) starts from accumulated error state
#    - Total loss: L_total = L_A + L_B
# 3. Stability & Continuous Coupling Constraints:
#    - Conservative velocity & momentum bounds (max_gain_v=0.45, max_gain_p=0.45, max_damp=0.15, inter_step_decay=0.90)

project:
  name: "spwm_v8_4"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32
  drift_injection_prob: 0.15     # Drift injection probability for train_corrector mode
  drift_magnitude: 0.05          # Impulsive perturbation scale on positions & velocities
  mixed_drift: false

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # total = q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [128, 128]  # 256 ALIF spiking neurons (128 reactive, 128 context)
  betas: [0.90, 0.985]

corrector:
  enabled: true
  dim: 128
  cadence: 5                    # Mantenuta: fornisce stabilità
  beta_mem: 0.97
  beta_adapt: 0.985
  v_th0: 0.65
  gamma: 0.05
  max_gain_v: 0.35
  max_gain_p: 0.40              # Alzato da 0.30 a 0.40: conferisce più autorità sull'inerzia/velocità latente
  max_damp: 0.30                # Alzato da 0.25 a 0.30: aumenta la capacità frenante contro le divergenze
  inter_step_decay: 0.95

training:
  mode: train_corrector
  predictor_checkpoint: results/spwm_v8_3/model_predictor.pt
  epochs: 150                   # Ridotto: il modello converge già tra epoca 40 e 80
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  corrector_lr: 0.00025         # Dimezzato (da 0.0005): stabilizza il plateau ed elimina le oscillazioni
  corrector_horizon: 25
  weight_decay: 0.001           # Alzato da 0.0005 a 0.001: previene pesi sproporzionati e drift su z
  batch_size: 32
  grad_clip_norm: 0.35          # Abbassato da 0.5 a 0.35: smussa ulteriormente le traiettorie di discesa

loss:
  lambda_corrector_asymptotic: 1.0
  beta_v: 3.5                   # Aumentato (se esposto): priorità raddoppiata alla loss di velocità
  lambda_latent_reg: 0.05       # Suggerimento implementativo: piccola penalità L2/MSE su z per ancorare il correttore
  lambda_corrector_quiescence: 0.03
  corrector_quiescence_margin: 0.2
  corrector_quiescence_cap: 0.5

evaluation:
  save_best_metric: "dynamic_score"   # Dynamic Score Weighting (Single-step loss & Drift distance to target)
  rollout_horizons: [1, 5, 10, 25, 50, 100]
  max_drift_ratio: 2.0
