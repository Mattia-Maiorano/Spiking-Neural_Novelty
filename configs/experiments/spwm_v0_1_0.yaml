# SPWM-v0.1.0: Neuromodulatory Gain Field System & Burn-in Rollout
#
# Key Features (v0.1.0):
# 1. Gain Field Modulation:
#    - The slow ALIF population acts as a neuromodulator, emitting a gain_mask in [-1, 1].
#    - Fast transitions are scaled: Δz_mod = Δz_fast * (1 + alpha_gain * gain_mask).
#    - Hot spots (>0) amplify dynamics, cold spots (<0) dampen them.
# 2. Burn-in Stabilization:
#    - During the first N rollout steps (corrector_burn_in_steps), the ALIF network 
#      integrates state internally but the gain_mask application is bypassed.
#    - This prevents uncalibrated gradients from corrupting the short-term local acuity.
# 3. Clean Asymptotic Optimization:
#    - Removed artificial Null-Space Isometry constraints (the gain mask natively prevents explosions).
#    - Removed Quiescence losses (the [-1, 1] bound naturally prevents runaway excitation).

project:
  name: "spwm_v0_1_0"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  box_size: 1.0
  dt: 0.05
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32
  drift_injection_prob: 0.20
  drift_magnitude: 0.05
  mixed_drift: false

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # total = q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [128, 128]
  betas: [0.90, 0.985]

corrector:
  enabled: true
  dim: 128
  beta_mem: 0.20
  beta_adapt: 0.05              
  v_th0: 0.50                   
  gamma: 0.08                   
  alpha_gain: 1               # NEW: Autorità massima della maschera di gain (30%)

training:
  mode: train_corrector
  # Assicurati che questo path punti al predittore pre-addestrato della nuova versione
  predictor_checkpoint: results/spwm_v0_1_0_train_predictor/model_predictor.pt
  epochs: 100                   
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  corrector_lr: 0.0004          
  corrector_horizon: 25         # Orizzonte su cui calcolare l'errore asintotico
  corrector_burn_in_steps: 0   # NEW: Step iniziali in cui il correttore "osserva" senza agire
  perturb_corrector_states: true
  corrector_perturbation_std: 0.08 
  weight_decay: 0.0005          
  batch_size: 32
  grad_clip_norm: 0.8           

loss:
  lambda_corrector_asymptotic: 1.0
  beta_v: 2.0                   # Riportato a 2.0 (standard). Puoi alzarlo a 3.5 se noti scarso aggancio sulla velocità.
  # Le vecchie loss (isometria e quiescenza) sono state rimosse definitivamente.

evaluation:
  rollout_horizons: [1, 5, 10, 25, 50, 100]
  max_drift_ratio: 2.0