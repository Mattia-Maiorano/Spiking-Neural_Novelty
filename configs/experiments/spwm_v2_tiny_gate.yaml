# Tiny Gate Diagnostic Configuration for Overfitting Test (8 Trajectories)
project:
  name: "spwm_v2_tiny_gate"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 8
  train_split: 1.0
  val_split: 0.0
  sequence_length: 20
  batch_size: 4

model:
  type: "spwm"
  encoder_dim: 128
  latent_dim: 128
  predictor_hidden_dim: 256
  local_lr: 0.0005
  inhibition_strength: 0.2
  alignment_noise_std: 0.01

memory:
  num_timescales: 3
  timescale_dims: [32, 64, 32]
  betas: [0.50, 0.90, 0.999]

training:
  epochs: 10
  learning_rate: 0.0005
  batch_size: 4
  sleep_interval: 2
  sleep_top_k: 16

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 0.5

evaluation:
  rollout_horizons: [1, 5, 10]
