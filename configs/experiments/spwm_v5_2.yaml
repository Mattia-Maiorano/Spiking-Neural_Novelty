# SPWM v5.2 – Symplectic Leapfrog Integration, Zero-DC Dendritic Force & Intrinsic Homeostasis
# Combines:
# 1. Störmer-Verlet Symplectic Leapfrog temporal split.
# 2. Row-centered zero-DC potential force matrix C_pq (sum_j C_ij = 0).
# 3. Passive dendritic compartment with exponential trace filtering.
# 4. Intrinsic ALIF threshold adaptation homeostasis (gamma_adapt=1.5, tau_adapt=0.2s).
# 5. Removal of L_homeo and progressive curriculum validation.

project:
  name: "spwm_v5_2"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0
  # Port-Hamiltonian & Symplectic Leapfrog settings
  recurrent_parametrization: "port_hamiltonian"
  symplectic_coupling: true
  rollout_scheme: "symplectic_leapfrog"
  beta_dend: 0.85
  alpha_dend: 0.10
  target_rate_center: 0.11
  epsilon_diss: 1e-4

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  tau_adapt: 0.2
  gamma: 1.5
  gamma_adapt: 1.5
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [64, 64]
  betas: [0.90, 0.985]

training:
  epochs: 100
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  weight_decay: 0.0001
  batch_size: 32
  grad_clip_norm: 1.0
  lr_scheduler: "cosine"
  scheduler_t_max: 100
  scheduler_eta_min: 1e-5
  scheduled_sampling:
    enabled: false
    warmup_epochs: 10
    ramp_epochs: 30
    p_max: 0.50

  validation_curriculum:
    enabled: false
    gates:
      - name: "Gate 1 (Short-Horizon Bio-Check)"
        epoch: 5
        horizon: 10
        min_spike_rate: 0.09
        max_spike_rate: 0.18
        max_l_coord: 0.045
        abort_on_fail: false
      - name: "Gate 2 (Medium-Horizon Rollout)"
        epoch: 30
        horizon: 50
        max_pos_err: 0.4518
        abort_on_fail: false
      - name: "Gate 3 (Ultra-Long Rollout Horizon)"
        epoch: 100
        horizon: 100
        max_pos_err: 0.5100
        abort_on_fail: false

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 2.0
  lambda_coord: 0.15
  target_spike_rate: 0.11

evaluation:
  save_best_metric: "val_pos_err"
  rollout_horizons: [1, 5, 10, 25, 50, 100]
