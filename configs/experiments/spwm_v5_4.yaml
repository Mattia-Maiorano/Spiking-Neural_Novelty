# SPWM v5.4 – Persistent Hamiltonian Limit Cycles with Active Velocity Supervision
# Resolves the open-loop freezing pathology of v5.3 by:
#   1. Calibrating ALIF threshold adaptation (gamma_adapt=0.35) to prevent post-sensory quenching.
#   2. Lowering the dissipation floor to epsilon_diss=1e-5 to sustain Hamiltonian orbital limit cycles.
#   3. Removing destructive spatial mean-centering and decoding velocity with standard linear projection (W_vel @ s_bar_p + b_vel).
#   4. Restoring physical momentum at boundaries via autonomous Wall Bounce Reflex (v_k <- -0.8 * v_k for |q| >= 0.98).
#   5. Active velocity supervision (lambda_vel=0.5) with direct gradient backprop through probe optimizer.

project:
  name: "spwm_v5_4"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0
  # Port-Hamiltonian settings: near-lossless limit cycles
  recurrent_parametrization: "port_hamiltonian"
  epsilon_diss: 1e-5
  symplectic_coupling: false
  rollout_scheme: "canonical"

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  # v5.4: Calibrated homeostasis preventing threshold quenching
  gamma: 0.35
  gamma_adapt: 0.35
  beta_adapt: 0.95  # uniform baseline; actual cells use heterogeneous [0.90, 0.985]
  surrogate: "atan"
  surrogate_alpha: 2.0
  intrinsic_homeostasis: true

memory:
  num_timescales: 2
  timescale_dims: [64, 64]
  betas: [0.90, 0.985]

training:
  epochs: 100
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  weight_decay: 0.0001
  batch_size: 32
  grad_clip_norm: 1.0
  lr_scheduler: "cosine"
  scheduler_t_max: 100
  scheduler_eta_min: 1e-5
  scheduled_sampling:
    enabled: false
  checkpoint_metric: "val_pos_err"

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.001
  lambda_probe: 2.0
  lambda_coord: 0.15
  lambda_vel: 0.5   # v5.4: active direct W_vel velocity supervision
  target_spike_rate: 0.11

evaluation:
  save_best_metric: "val_pos_err"
  rollout_horizons: [1, 5, 10, 25, 50, 100]
