# SPWM v7 – Decoupled Optimizer Architecture & Adaptive Z-Score Model Selection
#
# Key changes vs v6.6:
#   - Encoder update: pure geometric L_coord supervision only (no sensory consistency term).
#   - Predictor update: L_vel uses frozen decoder pass (_frozen() context manager);
#     dynamics fusion params (fuse_*, recurrent_proj, norm) belong to predictor_optimizer.
#   - Probe update: probe_optimizer contains ONLY physical_decoder / kinematic probe params.
#   - Best model selection: adaptive historical Z-Score on (val_pos_err, val_vel_err).
#     Simple sum used for first 5 epochs (warmup), full Z-Score from epoch 5 onwards.

project:
  name: "spwm_v7_1"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # total = q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [128, 128]  # 256 ALIF spiking neurons (128 reactive, 128 context)
  betas: [0.90, 0.985]

training:
  epochs: 450
  encoder_warmup_epochs: 60
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  weight_decay: 0.0001
  batch_size: 32
  grad_clip_norm: 1.0
  curriculum_multi_step: true

loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.5
  lambda_probe: 2.0
  lambda_vel: 0.5
  lambda_coord: 0.15
  multi_step_horizon: 3
  target_spike_rate: 0.10
  curriculum_thresholds:
    phase_1_horizon: 5
    phase_2_horizon: 15
    phase_2_threshold: 0.18
    phase_3_horizon: 50
    phase_3_threshold: 0.10

evaluation:
  zscore_warmup_epochs: 5       # epochs before switching from simple sum to full Z-score
  save_best_metric: "zscore_combined"
  rollout_horizons: [1, 5, 10, 25, 50, 100]
