# SPWM-v9: Hamiltonian Energy Modeling, Impulsive Jump & Latent Manifold Isometry
#
# Key Features (v9):
# 1. Hamiltonian Energy & Symplectically Coupled (q, p) Correction:
#    - Scalar corrective potential head: ΔΦ(q_t; u_t)
#    - Conservative momentum correction: Δp_cons = -∇_q ΔΦ(q_t)
#    - Viscous damping applied strictly to drain parasitic drift excess: Δp = Δp_cons - damp_t * p_t
#    - Symplectic position update coherent with corrected momentum: q_t^corr = clamp(q_t^fast + M^{-1} Δp, -1, 1)
# 2. Impulsive Jump Paradigm (Hybrid Event-Driven System):
#    - Inter-step geometric continuous decay completely eliminated
#    - Fast Predictor operates autonomously for t % Δ != 0 (Δq=0, Δp=0, damp=0)
#    - Corrector executes an instantaneous discrete reset (orthogonal jump) at t % Δ == 0
# 3. Deep-Horizon Rollout Training (No reset at H=25):
#    - Extended rollout horizon up to H=100
#    - Perturbation-resilient training from perturbed states
# 4. Local Kinematic Isometry Regularization:
#    - Prevents 124D null-space deformation of the physical decoder (128D -> 4D)
#    - L_isometry = MSE(||z_corr - z_fast||^2, k * ||Decoder(z_corr) - Decoder(z_fast)||^2)

project:
  name: "spwm_v9"
  seed: 42

environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08

data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32
  drift_injection_prob: 0.20
  drift_magnitude: 0.05
  mixed_drift: false

model:
  type: "spwm"
  encoder_type: "spatial_softmax"
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: [16, 32]
  latent_dim: 128  # total = q_dim + p_dim (32 + 96)
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0

neuron:
  model: "alif"
  threshold: 1.0
  beta_mem: 0.80
  gamma: 0.18
  surrogate: "atan"
  surrogate_alpha: 2.0

memory:
  num_timescales: 2
  timescale_dims: [128, 128]
  betas: [0.90, 0.985]

corrector:
  enabled: true
  dim: 128
  cadence: 5                    # Mantenuta: corretta per il salto impulsivo
  beta_mem: 0.95
  beta_adapt: 0.94              # Ridotto da 0.995: evita l'iper-polarizzazione/blocco prolungato
  v_th0: 0.50                   # Abbassato da 0.8: permette ai neuroni di scaricare senza correnti estreme
  gamma: 0.08                   # Ridotto da 0.25: abbassa la violenta auto-inibizione post-spike
  max_gain_p: 1.2               # Alzato da 0.9: conferisce piena autorità sul gradiente di momento
  max_damp: 0.35                # Alzato da 0.2: dissipazione viscosa più incisiva nei salti impulsivi

training:
  mode: train_corrector
  predictor_checkpoint: results/spwm_v8_3/model_predictor.pt
  epochs: 100                   # 100 epoche sono sufficienti se il gradiente scorre
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  corrector_lr: 0.0004          # Alzato da 0.00025: accelera l'uscita dal minimo conservativo
  corrector_horizon: 40         # Ridotto da 100 a 40: elimina il gradiente nullo/evanescente del BPTT a 100 step
  perturb_corrector_states: true
  corrector_perturbation_std: 0.08 # Alzato da 0.05: allena il recupero su deviazioni più severe
  weight_decay: 0.0005          # Dimezzato da 0.001 per concedere più margine dinamico
  batch_size: 32
  grad_clip_norm: 0.8           # Alzato da 0.35: evita che il clip tagli i gradienti degli impulsi salienti

loss:
  lambda_corrector_asymptotic: 1.0
  lambda_isometry: 0.4          # Ridotto da 1.0: 1.0 è troppo rigido e lega le mani al correttore
  k_isometry: 1.0
  beta_v: 3.5                   # Alzato da 2.0: forza il gradiente hamiltoniano ad agganciare la velocità
  lambda_corrector_quiescence: 0.02 # Abbassato: riduce la pressione sui neuroni attivi
  corrector_quiescence_margin: 0.25 # Tolleranza più ampia (fino al 25% di firing)
  corrector_quiescence_cap: 0.5


evaluation:
  save_best_metric: "dynamic_score"
  rollout_horizons: [1, 5, 10, 25, 50, 100]
  max_drift_ratio: 2.0
