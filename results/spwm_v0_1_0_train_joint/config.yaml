project:
  name: spwm_v0_1_0
  seed: 42
environment:
  num_objects: 1
  height: 32
  width: 32
  box_size: 1.0
  dt: 0.05
  event_threshold: 0.08
data:
  total_trajectories: 4000
  train_split: 0.8
  val_split: 0.1
  sequence_length: 31
  batch_size: 32
  drift_injection_prob: 0.2
  drift_magnitude: 0.05
  mixed_drift: true
  standard_velocity_range: !!python/tuple
  - -1.0
  - 1.0
  extrapolation_velocity_range: !!python/tuple
  - -2.0
  - 2.0
  num_workers: 0
  cache_data: true
model:
  type: spwm
  encoder_type: spatial_softmax
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: !!python/tuple
  - 16
  - 32
  latent_dim: 128
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  in_channels: 2
neuron:
  model: alif
  threshold: 1.0
  beta_mem: 0.8
  gamma: 0.18
  surrogate: atan
  surrogate_alpha: 2.0
memory:
  num_timescales: 2
  timescale_dims: !!python/tuple
  - 128
  - 128
  betas: !!python/tuple
  - 0.9
  - 0.985
corrector:
  enabled: true
  dim: 128
  beta_mem: 0.1
  beta_adapt: 0.02
  v_th0: 0.5
  gamma: 0.08
  alpha_gain: 1.0
training:
  mode: train_joint
  epochs: 300
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  weight_decay: 0.0005
  batch_size: 32
  grad_clip_norm: 0.8
  corrector_lr: 0.0004
  corrector_horizon: 25
  corrector_burn_in_steps: 0
  temporal_burn_in: 5
  perturb_corrector_states: true
  corrector_perturbation_std: 0.08
  predictor_checkpoint: null
  representation_checkpoint: null
loss:
  lambda_encoder: 1.0
  lambda_decoder: 1.0
  lambda_position: 1.0
  lambda_velocity: 2.0
  multi_step_horizon: 5
  beta_v: 2.0
  comb_sigma: 3.5
evaluation:
  rollout_horizons: !!python/tuple
  - 1
  - 5
  - 10
  - 25
  - 50
  - 100
