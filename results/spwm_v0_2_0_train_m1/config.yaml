project:
  name: spwm_v0_2_0
  seed: 42
environment:
  num_objects: 1
  height: 32
  width: 32
  box_size: 1.0
  dt: 0.05
  event_threshold: 0.08
data:
  total_trajectories: 4000
  train_split: 0.8
  val_split: 0.1
  sequence_length: 105
  batch_size: 32
  drift_injection_prob: 0.0
  drift_magnitude: 0.05
  mixed_drift: false
  standard_velocity_range: !!python/tuple
  - -1.0
  - 1.0
  extrapolation_velocity_range: !!python/tuple
  - -2.0
  - 2.0
  num_workers: 0
  cache_data: true
model:
  type: spwm
  encoder_type: spatial_softmax
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels: !!python/tuple
  - 16
  - 32
  latent_dim: 128
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  ema_decay: 0.9
  decoder_ema_alpha: 0.5
  in_channels: 2
neuron:
  model: alif
  threshold: 1.0
  beta_mem: 0.8
  gamma: 0.18
  surrogate: atan
  surrogate_alpha: 2.0
memory:
  num_timescales: 2
  timescale_dims: !!python/tuple
  - 128
  - 128
  betas: !!python/tuple
  - 0.9
  - 0.985
training:
  mode: train_m1
  epochs: 200
  early_stopping_patience: 20
  batch_size: 32
  weight_decay: 0.0005
  grad_clip_norm: 0.8
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  temporal_burn_in: 5
  representation_checkpoint: null
  phase_horizon: 10
  max_rollout_horizon: 30
  m1_checkpoint: null
  m2_checkpoint: null
  m1_horizon: 10
  m2_horizon: 10
  m3_horizon: 10
loss:
  lambda_encoder: 1.0
  lambda_decoder: 1.0
  lambda_latent: 1.0
  lambda_sensory: 1.0
  lambda_position: 1.0
  lambda_velocity: 2.0
  multi_step_horizon: 5
evaluation:
  rollout_horizons: !!python/tuple
  - 1
  - 5
  - 10
  - 25
  - 50
  - 100
