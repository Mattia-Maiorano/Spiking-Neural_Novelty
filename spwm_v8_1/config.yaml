project:
  name: spwm_v8_1
  seed: 42
environment:
  num_objects: 1
  height: 32
  width: 32
  event_threshold: 0.08
data:
  total_trajectories: 600
  train_split: 0.8
  val_split: 0.1
  sequence_length: 150
  batch_size: 32
  drift_injection_prob: 0.2
  drift_magnitude: 0.05
model:
  type: spwm
  encoder_type: spatial_softmax
  num_keypoints: 16
  encoder_dim: 128
  encoder_conv_channels:
  - 16
  - 32
  latent_dim: 128
  q_dim: 32
  p_dim: 96
  predictor_hidden_dim: 256
  local_lr: 0.0002
  lambda_kin_feedback: 1.0
  ema_decay: 0.9
  rls_enabled: false
  rls_forgetting: 0.99
  rls_delta: 1.0
neuron:
  model: alif
  threshold: 1.0
  beta_mem: 0.8
  gamma: 0.18
  surrogate: atan
  surrogate_alpha: 2.0
memory:
  num_timescales: 2
  timescale_dims:
  - 128
  - 128
  betas:
  - 0.9
  - 0.985
corrector:
  enabled: true
  dim: 64
  cadence: 5
  beta_mem: 0.95
  beta_adapt: 0.995
  v_th0: 1.5
  gamma: 0.25
  max_gain_v: 0.25
  max_gain_p: 0.25
  max_damp: 0.4
  inter_step_decay: 0.85
training:
  epochs: 450
  encoder_warmup_epochs: 60
  learning_rate: 0.0002
  probe_lr: 0.0005
  probe_weight_decay: 0.01
  corrector_lr: 0.0002
  corrector_horizon: 25
  weight_decay: 0.0001
  batch_size: 32
  grad_clip_norm: 1.0
  curriculum_multi_step: true
  smooth_horizon_sampling: false
loss:
  lambda_pred: 1.0
  lambda_multi: 0.5
  lambda_var: 0.1
  lambda_sparse: 0.5
  lambda_probe: 2.0
  lambda_vel: 0.5
  lambda_coord: 0.15
  lambda_corrector_asymptotic: 1.0
  lambda_corrector_quiescence: 0.5
  corrector_quiescence_margin: 0.15
  corrector_quiescence_cap: 0.5
  multi_step_horizon: 3
  target_spike_rate: 0.1
  curriculum_thresholds:
    phase_1_horizon: 3
    phase_2_horizon: 6
    phase_2_threshold: 0.2
    phase_3_horizon: 10
    phase_3_threshold: 0.12
evaluation:
  save_best_metric: dynamic_score
  rollout_horizons:
  - 1
  - 5
  - 10
  - 25
  - 50
  - 100
  max_drift_ratio: 2.0
